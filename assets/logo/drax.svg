<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="400" fill="#0D1322"/>

  <polygon fill="#1C2642" points="200,64 268,104 268,180 200,220 132,180 132,104"/>
  <polygon fill="none" stroke="#A78BFA" stroke-width="10" opacity="0.18"
