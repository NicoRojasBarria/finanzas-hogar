  <circle fill="#4FB8FF" opacity="0.8" cx="200" cy="240" r="3"/>

  <!-- separador -->
  <line stroke="#A78BFA" stroke-width="1.5" opacity="0.35"
        x1="148" y1="182" x2="252" y2="182"/>

  <!-- Drax dentro del hex -->
  <text x="200" y="165"
        font-family="Courier New, monospace"
        font-size="56" font-weight="900"
        fill="#E7EBF5" text-anchor="middle">Drax</text>

  <!-- Drax bajo el hex -->
  <text x="200" y="272"
        font-family="Courier New, monospace"
        font-size="24" font-weight="700"
        fill="#E7EBF5" text-anchor="middle" letter-spacing="3">Drax</text>

  <!-- subtítulo -->
  <text x="200" y="298"
        font-family="Courier New, monospace"
        font-size="12" font-weight="400"
        fill="#5A6484" text-anchor="middle" letter-spacing="2">Software by Drax</text>
