  <polygon fill="none" stroke="#A78BFA" stroke-width="3.5"
           points="200,64 268,104 268,180 200,220 132,180 132,104"/>

  <!-- circuitos izq -->
  <path fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.7"
        d="M132,136 L96,136 L96,164 L72,164 M96,136 L96,108 L60,108 M72,164 L60,164 L60,180 L40,180"/>
  <circle fill="#A78BFA" cx="96"  cy="136" r="4"/>
  <circle fill="#4FB8FF" opacity="0.8" cx="72"  cy="164" r="3.5"/>
  <circle fill="#A78BFA" cx="60"  cy="108" r="3"/>
  <circle fill="#4FB8FF" opacity="0.8" cx="40"  cy="180" r="3"/>

  <!-- circuitos der -->
  <path fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.7"
        d="M268,136 L304,136 L304,164 L328,164 M304,136 L304,108 L340,108 M328,164 L340,164 L340,180 L360,180"/>
  <circle fill="#A78BFA" cx="304" cy="136" r="4"/>
  <circle fill="#4FB8FF" opacity="0.8" cx="328" cy="164" r="3.5"/>
  <circle fill="#A78BFA" cx="340" cy="108" r="3"/>
  <circle fill="#4FB8FF" opacity="0.8" cx="360" cy="180" r="3"/>

  <!-- conector inferior -->
  <line fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.7"
